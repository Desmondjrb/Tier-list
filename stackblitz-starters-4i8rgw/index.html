<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <!--
      Need a visual blank slate?
      Remove all code in `styles.css`!
    -->
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body id="body">
    <!-- container for title, list, and tier list -->
    <div class="container">
      <!-- title -->
      <h1 class="title">Tier List</h1>
      <!-- reset button -->
      <button id="reset">Reset</button>


      <div class="tier-container clearfix">
        <div class="tier-row">
          <!-- s tier label and tier items container -->
          <div class="tier-label s-tier">S</div>
           <div class="tier-items clearfix"></div>
        </div>
        <div class="tier-row">
          <!-- a tier label and tier items container -->
          <div class="tier-label a-tier">A</div>
          <div class="tier-items clearfix"></div>
        </div>
        <div class="tier-row">
          <!-- b tier label and tier items container -->
          <div class="tier-label b-tier">B</div>
          <div class="tier-items clearfix"></div>
        </div>
        <div class="tier-row">
          <!-- c tier label and tier items container -->
          <div class="tier-label c-tier">C</div>
          <div class="tier-items clearfix"></div>
        </div>
        <div class="tier-row">
          <!-- d tier label and tier items container -->
          <div class="tier-label d-tier">D</div>
          <div class="tier-items clearfix"></div>
        </div>
        <div class="tier-row">
          <!-- f tier label and tier items container -->
          <div class="tier-label f-tier">f</div>
          <div class="tier-items clearfix"></div>
        </div>
      </div>
    </div>

    <!-- container for images. -->
    <div class="container " id="img-container">
      <img
        class="img" draggable="true"
        src="https://www.unileverfoodsolutions.us/dam/global-ufs/mcos/NAM/calcmenu/recipes/US-recipes/sandwiches/spicy-mayo-fried-chicken-sandwich/crispychickensandwich_1206x709.jpg"
      />
      <img
        class="img" draggable="true"
        src="https://recipe30.com/wp-content/uploads/2017/06/French-fries.jpg"
      />
      <img
        class="img" draggable="true"
        src="https://www.mccormick.com/-/media/project/oneweb/mccormick-us/mccormick/recipe-images/quick_and_easy_french_toast_new_800x800.webp?rev=ee6ad2bb4e784ae3b47792fe1567e606&vd=20240606T181333Z&extension=webp&hash=239069BA7916AD55FF124E6E65F4C335"
      />
      <img
        class="img" draggable="true"
        src="https://www.butterandbaggage.com/wp-content/uploads/2023/02/Macaroni-Pie-8.jpg"
      />
      <img
        class="img" draggable="true"
        src="https://atsloanestable.com/wp-content/uploads/2023/06/new-york-style-pizza2-500x500.jpg"
      />
      <img
        class="img" draggable="true"
        src="https://assets.epicurious.com/photos/5c745a108918ee7ab68daf79/1:1/w_2560%2Cc_limit/Smashburger-recipe-120219.jpg"
      />
      <img
        class="img" draggable="true"
        src="https://tastingwithtina.com/wp-content/uploads/2022/03/DSC_0167.jpg"
      />


    </div>
  </body>
</html>
